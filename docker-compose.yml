# Alternative dev database for machines with a working Docker daemon.
# scripts/dev-db.sh runs a rootless local instance and needs no Docker.
services:
  postgres:
    image: postgres:18-alpine
    container_name: sahayak-postgres
    environment:
      POSTGRES_USER: sahayak
      POSTGRES_PASSWORD: sahayak
      POSTGRES_DB: sahayak
    ports:
      - "5433:5432"
    volumes:
      - sahayak-pgdata:/var/lib/postgresql/data

volumes:
  sahayak-pgdata: